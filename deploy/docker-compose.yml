version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: penguingit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: penguingit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d penguingit"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: crates/penguingit-server/Dockerfile
    container_name: penguingit-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/penguingit
      PORT: 3000
      RUST_LOG: penguingit_server=info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
