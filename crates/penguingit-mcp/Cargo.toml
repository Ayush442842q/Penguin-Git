[package]
name = "penguingit-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
penguingit_lib = { package = "penguingit", path = "../../src-tauri" }
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
